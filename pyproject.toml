[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chargepark"
version = "0.1.0"
description = "Annual electricity procurement cost model for a DC HPC charging park"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "numba>=0.60",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "xarray>=2024.1",
    "h5netcdf>=1.3",
    "h5py>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chargepark = "chargepark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
